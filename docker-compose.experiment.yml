# BL-21 isolated experiment overlay. Always invoke through
# ./docker/bl21-experiment-compose.sh so host environment values cannot leak in.
services:
  db:
    environment:
      POSTGRES_DB: telegram_bot_bl21_experiment
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: experiment-only-password
    ports: !reset []

  app:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql+asyncpg://bot:experiment-only-password@db:5432/telegram_bot_bl21_experiment?experiment=bl21
      DB_PASSWORD: experiment-only-password
      BOT_TOKEN: ""
      TELEGRAM_TOKEN: ""
      BOT_ENABLED: "false"
      BOT_POLLING: "false"
      SCHEDULER_ENABLED: "false"
      ADMIN_ENABLED: "false"
      RUN_MIGRATIONS: "0"
    volumes: !override
      - ./config.experiment.toml:/app/config.toml:ro
      # The runner validates this clone as /app, including its .git metadata.
      - ./:/app:ro
      # Immutable clone evidence and copied datasets stay at the runner paths.
      - ./.data-experiment:/app/.data-experiment:ro
      # Reports are the sole writable host bind and remain inside the clone.
      - ./.data-experiment/experiments:/app/.data/experiments
    networks: !reset
      - default

  pgadmin:
    profiles:
      - manual
    ports: !reset []

volumes:
  pgdata:
    name: ${BL21_EXPERIMENT_PGDATA_VOLUME:?invoke through docker/bl21-experiment-compose.sh}

networks:
  caddy_proxy: !reset null
