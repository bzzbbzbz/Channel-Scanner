  - id: sc_outbox_relay_shadow
    name: BL-22 stage 2 relays manually enqueued transactional outbox events in shadow mode
    status: integration_backed_opt_in
    priority: high
    user_journey:
      - a caller adds one schema-valid content-free OutboxEvent inside its existing PostgreSQL transaction without an internal commit
      - outbox-relay claims due pending rows with FOR UPDATE SKIP LOCKED and a bounded publishing lease
      - the idempotent all-acks Kafka producer publishes the persisted topic, key, and immutable event envelope
      - a successful conditional update stores partition, offset, and publication time
      - if the broker accepted the event but PostgreSQL acknowledgement was lost, lease expiry permits publication of the same event_id and bytes again
      - each publication wait has a configured timeout shorter than the lease, so a hung idempotent producer returns the row to pending instead of leaving it publishing indefinitely
      - timeout remains ambiguous because Kafka may still have accepted the event; retry therefore preserves duplicate-republish semantics for the same event_id
      - publication failures return the row to pending with bounded full-jitter backoff and only an exception class code, never exception content
      - with the reliable-delivery master disabled, no domain flow enqueues events and visible delivery remains on the legacy path; stage 3 may explicitly add scheduler/render events for owned subscriptions
    entities:
      - outbox_event
    flows:
      - outbox_relay_shadow
    invariants:
      - inv_kafka_contract_content_free
      - inv_outbox_transaction_and_republication
      - inv_kafka_stage1_isolation
    evidence_tests:
      - tests/unit/test_kafka_producer.py
      - tests/unit/test_outbox_relay.py
      - tests/integration/test_outbox_repository.py
      - tests/integration/test_outbox_relay.py
