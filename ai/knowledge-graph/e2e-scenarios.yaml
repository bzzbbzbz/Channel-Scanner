  - id: sc_natural_language_subscription_update
    name: Natural-language assistant updates subscription notification schedule
    status: real_e2e_opt_in
    priority: high
    user_journey:
      - user sends a natural-language request to change notifications
      - bot shows Telegram typing feedback while the assistant is processing the turn
      - assistant system prompt includes current product limits for subscriptions, channels, and tool calls
      - assistant reads subscriptions through authorized tools
      - assistant stops before exceeding the configured per-turn product tool execution limit
      - assistant model selection uses cached tool-support probes, stops inline probing after a confirmed assistant model is available, and excludes unconfirmed tool support from the normal runtime order
      - ambiguous or missing subscription targets require clarification before mutation
      - assistant calls setNotification with a validated cron expression
      - valid interval cron schedules such as every 3 hours render in subscription tools without crashing
      - subscription-list countdown labels use the same timezone-aware cron schedule when the updated subscription is shown in the UI
      - bot emits a deterministic system confirmation visible to the user
      - product-state confirmations are localized for the user's language and bold the subscription name with Telegram HTML
      - assistant-visible messages render as Telegram HTML without raw Markdown markers such as `**bold**`
      - subscription cron state and chat history are persisted
      - independent mem0 memory layer can retrieve and update semantic preferences without exposing memory tools to the assistant
      - local mem0/Qdrant state is stored under the host-mounted `.data/mem0` path when running through Docker Compose
      - the single app process shares one memory service between scheduler digest filtering and bot assistant turns
    entities:
      - User
      - Subscription
      - ChatMessage
    flows:
      - natural_language_control
      - subscription_management
      - assistant_memory
    invariants:
      - inv_channel_scope
      - inv_cron_min_interval
      - inv_tool_authorization
      - inv_product_limits
      - inv_memory_not_tool_managed
      - inv_memory_local_persistence
    evidence_tests:
      - tests/unit/test_assistant_cron.py
      - tests/unit/test_assistant_cron.py::test_next_digest_at_uses_notification_cron_and_user_timezone
      - tests/integration/test_assistant_tools.py::test_assistant_get_subscriptions_handles_interval_hour_cron
      - tests/unit/test_telegram_formatting.py
      - tests/unit/test_bot_runtime.py::test_assistant_reply_shows_typing_and_uses_html_parse_mode
      - tests/integration/test_assistant_tools.py
      - tests/integration/test_assistant_service.py::test_assistant_executes_tool_and_records_visible_messages
      - tests/integration/test_assistant_service.py::test_assistant_stops_before_exceeding_tool_call_limit
      - tests/unit/test_openrouter_model_pool.py
      - tests/unit/test_bot_runtime.py
      - tests/e2e/test_nl_assistant_group_flows.py::test_nl_assistant_create_offtopic_digest_and_cleanup
    runner_target:
      kind: real_telegram_group_e2e
      notes:
        - use BL-01 E2E bot to send natural-language text into the allowlisted chat
        - assert visible system confirmation and persisted subscription notification_cron
        - assert model-pool tests cover bounded tool-support probing and assistant chain construction
        - assert RU and EN assistant tool confirmations use localized wording and bold escaped subscription names
        - assert typing feedback appears while the assistant works and visible text does not expose raw Markdown markers
        - include clarification path for missing/similar subscription names
        - Compose runtime must mount `./.data` to `/app/.data` for local mem0 persistence across app recreates
        - app startup should not create competing local Qdrant clients for the same `.data/mem0/qdrant` path
    verify_commands:
      - pytest tests/unit/test_assistant_cron.py
      - pytest tests/integration/test_assistant_tools.py::test_assistant_get_subscriptions_handles_interval_hour_cron
      - pytest tests/unit/test_telegram_formatting.py
      - pytest tests/unit/test_bot_runtime.py::test_assistant_reply_shows_typing_and_uses_html_parse_mode
      - pytest tests/integration/test_assistant_tools.py
      - pytest tests/integration/test_assistant_service.py::test_assistant_executes_tool_and_records_visible_messages
      - pytest tests/unit/test_openrouter_model_pool.py

  - id: sc_nl_assistant_e2e
    name: NL assistant creates subscription, handles off-topic, and triggers digest delivery
    status: real_e2e_opt_in
    priority: high
    user_journey:
      - user sends /start and registers via bot commands
      - /start uses Telegram-safe HTML to explain public text channel monitoring, focus management, filters, scheduled digests, and that natural-language requests are supported
      - user sends natural-language request to create a subscription, confirming explicitly
      - assistant returns localized product-limit errors if the request would exceed subscription or channel limits
      - bot emits deterministic system confirmation and persists the subscription
      - user sends an off-topic non-action request (tell a joke)
      - assistant replies without calling any product tools and without mutating state
      - seed channel and posts in the test DB, then deliver a due digest
      - digest is sent visibly into the group chat and delivery state is persisted
      - cleanup disables all subscriptions so no stray notifications reach the user
    entities:
      - User
      - Subscription
      - SubscriptionChannel
      - Channel
      - Post
      - DigestDelivery
      - ChatMessage
    flows:
      - natural_language_control
      - user_onboarding
      - subscription_management
      - digest_delivery_flow
    invariants:
      - inv_channel_scope
      - inv_subscription_baseline
      - inv_delivery_dedup
      - inv_due_logic
      - inv_tool_authorization
      - inv_product_limits
    evidence_tests:
      - tests/e2e/test_nl_assistant_group_flows.py::test_nl_assistant_sets_up_and_disables_subscription
      - tests/integration/test_assistant_tools.py::test_assistant_create_subscription_returns_limit_error
      - tests/integration/test_assistant_tools.py::test_assistant_add_channels_returns_limit_details
    runner_target:
      kind: real_telegram_group_e2e
      notes:
        - uses real BotRuntime with real OpenRouter LLM
        - uses dedicated tester bot in the shared E2E group chat
        - requires BOT_TOKEN, E2E_TELEGRAM_TOKEN, E2E_CHAT_ID, and OPENROUTER_API_KEY
        - sends a realistic user request to set up a subscription with channel, daily 9:00, summary format
        - handles clarification questions from the LLM by replying with confirmation
        - verifies resulting DB state (enabled, digest_format, notification_cron, channels)
        - then disables the subscription via NL and verifies DB state
        - DB-level cleanup guards against stray notifications after the test
    verify_commands:
      - pytest tests/e2e/test_nl_assistant_group_flows.py::test_nl_assistant_sets_up_and_disables_subscription

  - id: sc_on_demand_digest
    name: User requests an idempotent on-demand digest
    status: integration_backed
    priority: high
    user_journey:
      - user asks the natural-language assistant for a digest of one explicitly named subscription for a relative or explicit period
      - assistant resolves the period in the user's configured timezone and identifies the user-owned subscription before calling the tool
      - the tool paginates each selected channel to the interval start, stores at most 100 selected posts per channel with normal post deduplication, and renders the normal digest pipeline
      - the digest is sent once as Telegram-safe HTML without an assistant confirmation, duplicate, or expanded restatement; it does not create DigestDelivery or DigestProcessingLog rows or change last_digest_at
      - a repeat with the same subscription, normalized period, and effective prompts resends the stored rendered text without scraping or LLM generation
    entities:
      - User
      - Subscription
      - SubscriptionChannel
      - Channel
      - Post
      - OnDemandDigest
      - DigestDelivery
      - DigestProcessingLog
    flows:
      - natural_language_control
      - on_demand_digest
      - summary_generation
    invariants:
      - inv_post_dedup
      - inv_subscription_baseline
      - inv_summary_fallback
      - inv_safe_html
      - inv_tool_authorization
      - inv_on_demand_digest_idempotency
    evidence_tests:
      - tests/integration/test_assistant_tools.py::test_assistant_generates_and_reuses_on_demand_digest_without_delivery_state
      - tests/integration/test_assistant_service.py::test_assistant_does_not_reply_after_manual_digest_tool
      - tests/unit/test_scraper_service.py::test_scrape_channel_period_paginates_until_period_start
    runner_target:
      kind: real_telegram_group_e2e
      notes:
        - use a seeded user-owned subscription and public test channel in the allowlisted Telegram group
        - request a manual digest twice and assert each response contains only the tool-rendered digest, while the second reuses identical text without an additional model call
        - assert no scheduled delivery or processing-log records were created by the manual flow
    verify_commands:
      - pytest tests/integration/test_assistant_tools.py::test_assistant_generates_and_reuses_on_demand_digest_without_delivery_state
      - pytest tests/integration/test_assistant_service.py::test_assistant_does_not_reply_after_manual_digest_tool
      - pytest tests/unit/test_scraper_service.py::test_scrape_channel_period_paginates_until_period_start

  - id: sc_scraping_error_marks_channel
    name: Missing channel moves to error state during scraping
    status: integration_backed
    priority: medium
    user_journey:
      - scheduler scrapes an active channel
      - source channel is missing or invalid
      - channel state is marked error instead of crashing the whole job
    entities:
      - Channel
    flows:
      - scraping_job
    invariants:
      - inv_post_dedup
    evidence_tests:
      - tests/integration/test_scheduler.py::TestScrapingJob::test_scraping_job_marks_error_on_channel_not_found
      - tests/integration/test_scheduler.py::TestScrapingJob::test_scraping_job_handles_generic_exception
    runner_target:
      kind: app_process_e2e
      notes:
        - assert channel status transition and continued progress for other channels
    verify_commands:
      - pytest tests/integration/test_scheduler.py::TestScrapingJob::test_scraping_job_marks_error_on_channel_not_found
      - pytest tests/integration/test_scheduler.py::TestScrapingJob::test_scraping_job_handles_generic_exception

  - id: sc_admin_dashboard_metrics
    name: Authenticated administrator reads responsive product metrics
    status: integration_backed
    priority: medium
    user_journey:
      - administrator opens csd.ai-research.arha.digital and must authenticate with environment-configured credentials
      - administrator chooses 24 hours, 7 days, all time, or a valid custom UTC interval
      - all-time starts at the earliest stored dashboard event instead of 1970 when data exists
      - dashboard renders aggregate growth/activity, delivery/processing, engagement, current channel errors, LLM model/token/cost metrics, and read-only knowledge catalog/request/import/query totals without mutation controls
      - dashboard displays unavailable LLM cost honestly until OpenRouter usage telemetry exists
      - administrator can use the page on a narrow mobile viewport without horizontal page overflow, and chart X-axis dates use dd.mm labels
    entities:
      - User
      - Subscription
      - Channel
      - Post
      - DigestDelivery
      - DigestProcessingLog
      - ChatMessage
      - LlmUsage
    flows:
      - admin_dashboard
      - summary_generation
      - natural_language_control
    invariants:
      - inv_admin_read_only
      - inv_llm_telemetry_nonblocking
    evidence_tests:
      - tests/integration/test_admin_dashboard.py
      - tests/unit/test_llm_telemetry.py
      - tests/browser/admin_dashboard.spec.js
    runner_target:
      kind: browser_regression_and_HTTPS_manual
      notes:
        - tests/browser/admin_dashboard_server.py starts an isolated SQLite dashboard; Playwright checks mobile numeric axes, dd.mm period labels, static legends, and viewport fit
        - run docker compose with valid credentials and public DNS for csd.ai-research.arha.digital
        - verify Caddy obtains TLS and the secure session cookie permits the dashboard only after a successful login
        - verify the public Caddy route manually because browser regression coverage intentionally avoids production credentials and data
    verify_commands:
      - pytest tests/integration/test_admin_dashboard.py
      - pytest tests/unit/test_llm_telemetry.py
      - npm run test:browser

  - id: sc_knowledge_channel_rag
    name: User searches public catalog and owned subscriptions through grounded RAG
    status: integration_backed
    priority: high
    user_journey:
      - user asks the natural-language assistant about one explicitly resolved approved public catalog channel or one named owned subscription
      - assistant resolves the catalog through listKnowledgeChannels, or resolves the named subscription before searching it
      - normal search reads only already collected canonical posts and labels limited coverage honestly
      - deep search retrieves approved indexed representations, collapses them by parent post, reconstructs original context, and cites one to five original Telegram post links
      - metadata enrichment uses configured direct DeepSeek V4 Flash; grounded answer generation uses the digest free-model pool with health backoff before DeepSeek V4 Flash emergency fallback
      - a mixed subscription marks indexed channels as deep and unindexed channels as normal
      - subscription results exclude channels outside the subscription and posts before subscribed_at regardless of representation type
      - insufficient evidence produces a localized grounded result rather than an invented answer, and terminal tool output is the only assistant response for the turn
    entities:
      - Post
      - KnowledgeDocument
      - KnowledgeRepresentation
      - KnowledgeQuery
      - SubscriptionChannel
    flows:
      - knowledge_search
      - natural_language_control
    invariants:
      - inv_knowledge_canonical_citations
      - inv_knowledge_parent_scope
      - inv_safe_html
      - inv_tool_authorization
    evidence_tests:
      - tests/unit/test_knowledge_representations.py
      - tests/unit/test_knowledge_model_pool.py
      - tests/integration/test_knowledge_search.py::test_subscription_knowledge_search_enforces_membership_and_baseline
      - tests/integration/test_knowledge_assistant_tools.py::test_search_knowledge_is_user_scoped_terminal_output
    runner_target:
      kind: real_telegram_group_e2e
      notes:
        - seed an approved catalog channel with an indexed export and a user-owned subscription sharing a later subscribed_at baseline
        - ask one catalog and one subscription question, then verify Telegram-safe original links, mode labels, and absence of an assistant restatement
    verify_commands:
      - pytest tests/unit/test_knowledge_representations.py
      - pytest tests/integration/test_knowledge_search.py
      - pytest tests/integration/test_knowledge_assistant_tools.py

  - id: sc_knowledge_catalog_moderation_import
    name: Administrator approves and imports a public knowledge channel
    status: integration_backed
    priority: high
    user_journey:
      - user asks to add a public channel and receives a pending-review confirmation
      - configured Telegram administrator opens pending requests, approves or rejects through a callback, and only an approved target accepts an official JSON document upload with the channel identifier in its caption
      - bounded export validation and queued processing persist canonical posts idempotently before direct-DeepSeek enrichment or vectorization, then retain content-free enrichment, embedding, and total import costs
      - imported catalog backfill posts are recorded as skipped for existing channel subscriptions and must never trigger a historical digest
      - enrichment or Qdrant errors leave canonical posts searchable through normal lexical search, record bounded retry/error state, and are retried by the four-hour knowledge indexing job
      - successful import appears in the shared catalog and dashboard read metrics, including the latest manually-labelled retrieval evaluation, without exposing export, question, or answer text
    entities:
      - KnowledgeChannelRequest
      - KnowledgeChannel
      - KnowledgeImport
      - Post
      - KnowledgeDocument
      - KnowledgeRepresentation
    flows:
      - knowledge_catalog_moderation
      - knowledge_search
      - admin_dashboard
    invariants:
      - inv_post_dedup
      - inv_knowledge_canonical_citations
      - inv_knowledge_fallback_isolation
      - inv_knowledge_import_digest_isolation
      - inv_admin_read_only
    evidence_tests:
      - tests/integration/test_knowledge_search.py::test_admin_import_persists_canonical_posts_when_enrichment_is_unavailable
      - tests/integration/test_knowledge_search.py::test_official_export_parser_keeps_public_text_messages_only
      - tests/integration/test_knowledge_search.py::test_knowledge_retry_reprocesses_failed_enrichment_and_vectors_within_limit
      - tests/integration/test_scheduler.py::test_knowledge_index_job_retries_pending_and_failed_work
      - tests/integration/test_admin_dashboard.py::test_admin_dashboard_requires_login_and_returns_aggregates
      - tests/unit/test_knowledge_evaluation.py::test_evaluation_persists_parent_level_hybrid_metrics
    runner_target:
      kind: real_telegram_group_e2e
      notes:
        - use a configured administrator and allowlisted test chat to approve one request, upload a small official JSON export, wait for completion, query the catalog, then clean up rows and local Qdrant data
    verify_commands:
      - pytest tests/integration/test_knowledge_search.py

  - id: sc_knowledge_quality_experiments
    name: Isolated content-free RAG quality experiment control plane
    status: unit_backed
    priority: high
    user_journey:
      - operator configures a local experiment policy and uses a known dataset SHA-256 without copying corpus content or calling providers
      - the system deterministically assigns evaluation IDs to 70/30 train/holdout sets and exposes only their hashes and counts in a report
      - a durable content-free campaign/candidate store serializes each hashed channel, enforces unique candidate configs, resumes only matching failed campaigns or running candidates, and rejects unsafe transitions; its closed typed JSON fields reject nested content/credential keys and string values on mapped ORM/Core inserts before persistence (raw untyped SQL is not claimed safe)
      - projected operations reserve from a one-dollar local budget before actual accounting; a projected or actual overage is blocked
      - aggregate retrieval metrics collapse duplicate canonical parents before the rank cutoff, apply fixed promotion gates, and mark an initial-dataset pass as passing_for_review rather than promoted
      - an atomic report derives the resolved Git root and active BL-21 feature branch, writes only under .data-experiment/experiments, and rejects caller branch evidence, non-repositories, symlinks, escapes, any ancestry or descendant .data/knowledge index, and the source worktree
      - the isolated Compose rendering derives stable safe project/database-volume identities from each canonical clone directory, pins every Docker/Compose action to the safe local Unix socket and clone-controlled HOME/config, replaces inherited host binds, exposes only clone `.git` evidence plus read-only manifest/dataset paths at /app/.data-experiment and only clone-local .data-experiment/experiments writable at the identical report path, without a knowledge index, Caddy/n8n network, or database host port; its fail-closed launcher permits only static config/identity, isolated app-image build, fixed no-deps db-up plus bounded isolated-db-only health polling against the exact expected PostgreSQL 16 container identity, fixed no-argument snapshot-export with an exclusive lock that writes and validates a new opaque private dump/manifest generation before same-filesystem atomic current-pointer replacement, never moves/deletes/overwrites prior current, and defers cleanup; SIGKILL before the switch preserves old current and after it preserves new current, while restore holds a shared lock and rejects symlinks, path escapes, malformed pointers/generations, unsafe modes, unexpected files, or invalid SHA/target before selecting only current with fixed pg_restore, fixed no-deps migration, and a fixed no-deps experiment runner with validated arguments, never arbitrary Compose commands/services/flags/paths/entrypoints or detached execution
      - before fixed one-off migration or runner invocation, the launcher validates its canonical clone root, BL-21 feature branch, and full lowercase HEAD revision, then supplies only those non-secret values as fixed run metadata; runner uses it only when direct Git is unavailable and rejects missing, malformed, wrong-branch, or Git-conflicting metadata
      - snapshot-export and db-restore only contact the derived isolated db and never source/production; unfinished or non-current generations are never selected
      - the required preflight validates the feature branch/report root and explicitly experiment-marked internal clone URL, reads immutable manifest/dataset bytes once through validated regular files, and binds those parsed cases and snapshot counts through control-plane/report creation; dry-run creates no database/report state or calls retrieval, while explicit execute permits only declared canonical-Post escaped-literal token/exact ILIKE, query-only PostgreSQL Russian FTS, and exact-phrase short-circuit candidates in exactly one ready catalog channel
      - execute rejects vector/model/reindex selection, records only content-free declared config, phase-separated aggregate metrics, retrieval/lexical percentiles, and coded decisions, selects using development only before holdout, and leaves every passing result as passing_for_review; the exact-phrase candidate fails for scope/citation/metric safety issues or any baseline regression
    entities:
      - ExperimentPolicy
      - Campaign
      - Candidate
      - BudgetReservation
      - ExperimentCampaign
      - ExperimentCandidate
    flows:
      - knowledge_quality_experiments
    invariants:
      - inv_knowledge_experiment_content_safety
    evidence_tests:
      - tests/unit/test_knowledge_experiments.py
      - tests/unit/test_knowledge_evaluation.py
      - tests/unit/test_knowledge_experiment_control_plane.py
      - tests/unit/test_knowledge_experiment_retriever.py
    runner_target:
      kind: local_unit
      notes:
        - the durable store and lexical scope are covered with in-memory SQLite; PostgreSQL FTS SQL is compiled and SQLite fails closed. An opt-in clone-DB smoke remains manual and must use only the isolated database.
    verify_commands:
      - pytest tests/unit/test_knowledge_experiments.py
      - pytest tests/unit/test_knowledge_evaluation.py
      - pytest tests/unit/test_knowledge_experiment_control_plane.py
      - pytest tests/unit/test_knowledge_experiment_retriever.py
      - ./docker/bl21-experiment-compose.sh config
      - bash -n docker/bl21-experiment-compose.sh

agent_rules:
  change_to_scenario_mapping:
    - if files under src/bot/ or src/repository/subscription.py change, load sc_create_subscription_and_add_channel
    - if files under src/scheduler/ or src/scraper/ change, load sc_scrape_and_deliver_short_digest, sc_on_demand_digest, and sc_scraping_error_marks_channel
    - if files under src/digest/ or src/llm/ change, load sc_scrape_and_deliver_short_digest, sc_summary_fallback_delivery, and sc_batch_digest_summary
    - if subscribed_at logic or pending-post selection changes, load sc_historical_posts_excluded
    - if files under src/assistant/ or src/repository/chat_message.py change, load sc_natural_language_subscription_update, sc_nl_assistant_e2e, sc_debug_digest_prompts, and sc_on_demand_digest
    - if replay-period post selection changes, load sc_debug_digest_prompts and sc_historical_posts_excluded
    - if files under src/admin/ or src/models/llm_usage.py change, load sc_admin_dashboard_metrics
    - if files under src/knowledge/ or src/models/knowledge.py change, load sc_knowledge_channel_rag and sc_knowledge_catalog_moderation_import
    - if src/knowledge/experiments.py changes, load sc_knowledge_quality_experiments
  report_expectations:
    - say which scenarios were considered impacted
    - say which evidence tests were run
    - say whether true external E2E remains missing or only partially covered by opt-in real Telegram tests
    - say whether technical debt was logged in .planning/TECH_DEBT.md
