    name: BL-22 stage 5 records content-free DLQ failures and replays one generation
    status: integration_backed_opt_in_postgres
    priority: high
    user_journey:
      - terminal render or Telegram failure atomically creates or updates one DeadLetterRecord and one existing v1 DLQ OutboxEvent in PostgreSQL without direct Kafka publication
      - an identifiable unsupported envelope version/schema follows the same permanent DB plus DLQ outbox path
      - a fully unreadable payload creates one content-free topic/partition/offset record, commits the offset, and emits no Kafka DLQ event because contract identifiers are absent
      - an authenticated administrator filters and opens content-free Reliability/DLQ detail without message, post, prompt, provider-response, or arbitrary payload content
      - replay requires signed session, CSRF header, and Idempotency-Key, locks one record, validates run/message/subscription state, and appends one next-generation root or delivery OutboxEvent
      - a duplicate key returns the same audit result; a missing entity appends replay_rejected without work; bulk replay and discard do not exist
      - deleting the source subscription through SubscriptionRepository removes its delivery/processing rows, cascades the run/messages, preserves detached dead-letter identity/audit, and makes a later replay fail as ReplayEntityMissing without work
    entities:
      - DeadLetterRecord
      - DeadLetterReplay
      - DigestRun
      - DigestOutboxMessage
      - OutboxEvent
    flows:
      - reliable_dead_letter_stage5
      - admin_dashboard
    invariants:
      - inv_dead_letter_atomic_recovery
      - inv_kafka_contract_content_free
      - inv_admin_read_only_except_dead_letter_replay
    evidence_tests:
      - tests/integration/test_dead_letter_stage5.py
      - tests/integration/test_dead_letter_postgres.py::test_concurrent_replay_key_creates_one_generation_and_outbox
      - tests/integration/test_admin_dashboard.py
      - tests/browser/admin_dashboard.spec.js
    runner_target:
      kind: repository_browser_with_opt_in_postgresql
      notes:
        - SQLite verifies transactions, dedup, API auth/CSRF/content exclusion, run/message replay and rejected missing entities
        - PostgreSQL FOR UPDATE is compiled by default; BL22_POSTGRES_TEST_URL enables an isolated-schema concurrent idempotency race
        - stage 6 covers PostgreSQL/Kafka recovery and browser replay; stage 7 real Telegram acceptance completed successfully on 2026-08-24
    verify_commands:
      - pytest tests/integration/test_dead_letter_stage5.py tests/unit/test_kafka_consumer.py
      - BL22_POSTGRES_TEST_URL=postgresql+asyncpg://... pytest tests/integration/test_dead_letter_postgres.py
      - npm run test:browser

  - id: sc_bl22_stage6_process_e2e
    name: BL-22 stage 6 recovers the full isolated PostgreSQL Kafka process path
    status: automated_docker_e2e
    priority: high
    user_journey:
      - the harness creates a unique Compose project with fresh PostgreSQL 16 and Kafka 3.9.2 volumes, then applies every Alembic migration from an absent version table
      - scheduler, outbox relay, digest worker, and Telegram delivery worker run as separate containers from the same freshly built application image; no DigestService.run_once direct call is used
      - each critical role becomes ready only after its runtime dependency startup; stopping every role removes readiness and restarting it proves a new matching role/PID/process-start generation
      - only the Telegram delivery worker receives BOT_TOKEN; scheduler, relay, digest worker, and the normal app remain tokenless, while a production legacy digest job with a fail-on-send sender proves the due reliable-owned subscription retains pending posts but creates no legacy send or delivery
      - while Kafka is stopped, scheduler atomically persists one due run and root outbox event and relay's hard publication deadline persists a bounded failure even if the client resists cancellation; the outage-era producer is stopped before metrics, broker recovery, and expediting only the existing failed retry time
      - authenticated content-free metrics report unpublished outbox/retry, expired inbox/run leases, pending message retry, and open DLQ at the corresponding live failure states
      - after broker recovery a sentinel-guarded one-shot hook exits relay with code 86 after the first broker ACK and before PostgreSQL publication metadata; the row remains publishing with no broker offset
      - restart reclaims the naturally expired publishing lease and produces exactly one second record with the same event_id and byte-identical envelope
      - a sentinel-guarded one-shot hook exits digest worker with code 87 after handler DB commit and before Kafka offset commit; restart consumes both immutable records, advances the real group offset, and never rerenders or creates a second internal outcome without any offset rewind
      - a new digest-worker process reclaims deliberately expired inbox and run leases and completes with attempt counts preserved
      - fake Telegram accepts one send, allocates a message ID, and withholds the response past sender timeout; the durable ambiguous retry produces a second accepted message ID with the same text fingerprint
      - fake Telegram accepts two calls and returns 429 for a third; after the delivery process restarts, only the failed part fingerprint is called again and the first two remain sent
      - two transient failures exhaust the configured durable budget, atomically create one DB dead letter and DLQ outbox event, and relay publishes a schema-valid content-free Kafka DLQ event
      - real Chromium uses the dashboard list, detail, and replay controls; repeating the captured UI request with the same idempotency key leaves one audit and one generation-2 outbox event
      - structured scheduler/relay/render/delivery transitions are correlated to persisted event/run/message ids and all evidence/logs exclude the private marker, message content, and bot token
      - finally removes the isolated containers, network, both data volumes, and exact image, verifies no UUID-scoped resource remains, and fails acceptance if cleanup is incomplete
    entities:
      - OutboxEvent
      - InboxEvent
      - DigestRun
      - DigestOutboxMessage
      - DigestDelivery
      - DigestProcessingLog
      - DeadLetterRecord
      - DeadLetterReplay
    flows:
      - bl22_stage6_process_e2e
      - outbox_relay_shadow
      - reliable_digest_stage3
      - reliable_telegram_delivery_stage4
      - reliable_dead_letter_stage5
      - admin_dashboard
    invariants:
      - inv_alembic_clean_boot
      - inv_kafka_contract_content_free
      - inv_outbox_transaction_and_republication
      - inv_reliable_digest_ownership
      - inv_inbox_render_dedup
      - inv_reliable_telegram_attempts
      - inv_reliable_run_finalization
      - inv_dead_letter_atomic_recovery
      - inv_admin_read_only_except_dead_letter_replay
    evidence_tests:
      - tests/e2e/test_kafka_reliable_digest.py::test_bl22_stage6_isolated_postgres_kafka_process_recovery
      - tests/browser/bl22_stage6_dashboard.spec.js
    runner_target:
      kind: isolated_docker_process_and_browser_e2e
      notes:
        - use ./scripts/run-bl22-stage6-e2e.sh; Docker, npm dependencies, and Playwright Chromium are required
        - guarded faults require BL22_STAGE6_E2E, a UUID run id, exact isolated endpoints, and the read-only sentinel; arbitrary custom Bot API endpoints fail closed
        - evidence exposes only identifiers, codes, counts, sizes, and SHA-256 fingerprints; post/message content and the bot token are not printed or placed in Kafka/DLQ
        - this proves a single-node local Kafka recovery basis, not production cluster HA, TLS/SASL, or real Telegram behavior
        - stage 7 real Telegram delivery succeeded and BL-22 acceptance is closed; general reliable rollout remains separately disabled
    verify_commands:
      - ./scripts/run-bl22-stage6-e2e.sh

  - id: sc_bl22_stage7_real_telegram_e2e
    name: BL-22 stage 7 sends one real Telegram digest and suppresses an exact duplicate
    status: automated_real_telegram_e2e_passed
    priority: high
    user_journey:
      - mandatory preflight loads product fallback token, tester token and group id only from .env, rejects missing/malformed/equal credentials or a non-group-shaped id, and never prints secrets
      - a unique Compose project/image creates fresh PostgreSQL 16 and Kafka 3.9.2 volumes and migrates the absent database through 0024 before domain setup
      - preflight verifies effective current-app credential, captures running id/StartedAt, requires startup polling markers from that generation and keeps both unchanged; runner creates no second poller and checks no observed conflict without claiming unknown external pollers are impossible
      - before send the exact tester row updated_at or absence is captured; unique /start BL22S7_runid must produce a strict updated_at change inside send/observe bounds, exact tester/chat/actual chat_type and a new handled-update log line, then tester deletes its own message when permitted
      - this bot-to-bot onboarding is accepted as empirical behavior of this deployment, not a universal Telegram contract; control mirrors only tester_id/chat_id/chat_type into clean isolated PostgreSQL and seeds one due subscription/channel/digest marker
      - product token is absent from stage_env and child token variables; a temporary 0600 Compose secret is mounted only into delivery through fail-closed BOT_TOKEN_FILE, while tester token stays in host Bot objects
      - OutboxEvent passes Kafka and a completed root InboxEvent into one DigestRun and persisted part; real sendMessage returns a stored telegram_message_id, then one post delivery, one processing log and last_digest_at finalize
      - visible-send evidence is honest: one real accepted send, marker present in the persisted part and one content-free sent transition; tester bot is not claimed to read product-bot messages
      - control publishes the exact same event_id/key/envelope bytes directly to isolated Kafka without DB mutation; audit consumes exactly two matching records and compares key/partition/SHA-256 bytes/DB envelope before the main offset advances with no duplicate state/send
      - cleanup passes complete non-secret env to Compose; fallback removes exact project-label containers before volumes/networks and token deletion, while final image absence must be explicitly confirmed as No such image rather than inferred from rm or inspect failure
      - successful content-free report records HEAD, source/harness/image provenance, accepted_send_count 1, completed run/inboxes, sent part, duplicate suppression, continuous production app and successful cleanup in 450.883 seconds
    entities:
      - User
      - Subscription
      - OutboxEvent
      - InboxEvent
      - DigestRun
      - DigestOutboxMessage
      - DigestDelivery
      - DigestProcessingLog
    flows:
      - bl22_stage7_real_telegram_e2e
      - user_onboarding
      - outbox_relay_shadow
      - reliable_digest_stage3
      - reliable_telegram_delivery_stage4
    invariants:
      - inv_stage7_real_telegram_isolation
      - inv_alembic_clean_boot
      - inv_kafka_contract_content_free
      - inv_reliable_digest_ownership
      - inv_inbox_render_dedup
      - inv_reliable_telegram_attempts
      - inv_reliable_run_finalization
      - inv_delivery_dedup
    evidence_tests:
      - tests/unit/test_stage7_harness.py
      - tests/unit/test_e2e_faults.py::test_stage7_default_bot_api_does_not_activate_stage6_custom_api_guard
      - tests/e2e/test_bl22_stage7_real_telegram.py::test_bl22_stage7_real_telegram_delivery_and_duplicate_suppression
      - .planning/evaluations/bl22-stage7/bl22-stage7-20260824T045339.868888Z.json
    runner_target:
      kind: isolated_docker_real_telegram_e2e
      notes:
        - run only with ./scripts/run-bl22-stage7-e2e.sh; current production app must remain continuously running and is never managed by the runner
        - real Telegram acceptance passed at 2026-08-24T04:53:39.868888Z; report path is .planning/evaluations/bl22-stage7/bl22-stage7-20260824T045339.868888Z.json
        - Bot API cannot provide a bot-only observer of another bot's group message, so persisted acknowledgement plus content-free transition is the declared visible-send evidence
