# BL-21 isolated experiment settings. This file is mounted over /app/config.toml
# only by docker-compose.experiment.yml; it contains no production credentials.

[database]
# The evaluate CLI owns the mandatory marker. Engine and Alembic URLs must be driver-safe.
url = "postgresql+asyncpg://bot:experiment-only-password@db:5432/telegram_bot_bl21_experiment"
pool_size = 5
pool_recycle = 3600

[scheduler]
enabled = false
interval_minutes = 5

[bot]
enabled = false
polling = false
token = ""
set_commands_on_startup = false
drop_pending_updates = false
default_timezone = "UTC"

[assistant]
enabled = false

[knowledge]
enabled = false

[memory]
enabled = false
qdrant_path = ".data/mem0/qdrant"
history_db_path = ".data/mem0/history.db"
collection_name = "telegram_parser_bot_memories_bl21_experiment"

[admin]
enabled = false

[logging]
level = "INFO"
format = "json"
