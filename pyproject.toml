[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-parser-bot"
version = "0.1.0"
description = "Telegram channel parser and post aggregator"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "aiogram>=3.6,<4.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.12",
    "apscheduler>=3.10,<4.0",
    "croniter>=2.0",
    "mem0ai>=2.0.5,<3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "itsdangerous>=2.2,<3",
    "qdrant-client>=1.12,<2",
    "aiokafka==0.14.0",
    "jsonschema==4.25.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.bot" = ["content/*.md"]
"src.admin" = ["dashboard.html"]
"src.reliability" = ["schemas/*.json", "examples/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: opt-in real Telegram end-to-end coverage",
    "postgres: opt-in isolated real PostgreSQL coverage",
    "stage6: isolated BL-22 Docker process acceptance coverage",
    "stage7: opt-in BL-22 isolated real Telegram acceptance coverage",
]
